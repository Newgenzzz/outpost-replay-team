<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" width="300" height="270">
  <defs>
    <linearGradient id="habWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="habDomeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="greenhouseGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Ground Shadow -->
  <ellipse cx="152" cy="228" rx="134" ry="30" fill="#020617" opacity="0.68"/>

  <!-- 2.5D Raised Foundation Platform (Top + Front Vertical Wall) -->
  <polygon points="24,198 276,198 288,218 288,236 276,246 24,246 12,236 12,218" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <polygon points="28,162 272,162 288,218 12,218" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

  <!-- Right Wing: 2.5D Arched Transparent Hydroponic Greenhouse Tunnel -->
  <!-- Vertical Front & Side Wall of Greenhouse -->
  <path d="M178,188 L268,188 L268,136 C268,108 178,108 178,136 Z" fill="url(#greenhouseGlass)" stroke="#6ee7b7" stroke-width="2.5"/>
  <!-- 3D Rows of Glowing Green Hydroponic Plants Inside -->
  <rect x="188" y="164" width="68" height="10" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="198" cy="161" r="6" fill="#4ade80"/>
  <circle cx="212" cy="160" r="7" fill="#22c55e"/>
  <circle cx="226" cy="161" r="6" fill="#4ade80"/>
  <circle cx="240" cy="160" r="7" fill="#22c55e"/>
  <rect x="192" y="144" width="60" height="9" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="202" cy="141" r="5" fill="#86efac"/>
  <circle cx="216" cy="140" r="6" fill="#4ade80"/>
  <circle cx="230" cy="141" r="5" fill="#86efac"/>
  <circle cx="242" cy="140" r="6" fill="#4ade80"/>
  <!-- Greenhouse Structural Ribs -->
  <path d="M198,188 L198,128 C198,116 248,116 248,128 L248,188" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.75"/>

  <!-- Main 2.5D Pressurized Habitat Cylinder Wall (3/4 Extruded Drum) -->
  <path d="M36,128 L194,128 L194,192 C194,208 36,208 36,192 Z" fill="url(#habWall)" stroke="#475569" stroke-width="2.5"/>
  <!-- Structural Titanium Rib Columns on Front Cylinder Wall -->
  <rect x="52" y="128" width="6" height="66" fill="#64748b"/>
  <rect x="172" y="128" width="6" height="66" fill="#64748b"/>

  <!-- Glowing Panoramic Crew Windows on the Front Wall -->
  <rect x="64" y="144" width="26" height="18" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <rect x="66" y="146" width="22" height="6" rx="2" fill="#e0f2fe" opacity="0.85"/>
  <rect x="140" y="144" width="26" height="18" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <rect x="142" y="146" width="22" height="6" rx="2" fill="#e0f2fe" opacity="0.85"/>

  <!-- 2.5D Vaulted Geodesic Glass & Titanium Dome Roof Rising Above Cylinder -->
  <path d="M36,130 C36,34 194,34 194,130 Z" fill="url(#habDomeGlass)" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Geodesic Triangular Truss Arch Lines Across Vaulted Dome -->
  <path d="M62,128 C68,56 162,56 168,128" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
  <path d="M90,128 C96,48 134,48 140,128" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
  <ellipse cx="115" cy="96" rx="68" ry="14" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.75"/>
  <ellipse cx="115" cy="70" rx="44" ry="9" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.75"/>

  <!-- Top Communications & ECLSS Condenser Crown on Peak of Dome -->
  <ellipse cx="115" cy="52" rx="24" ry="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="115" cy="48" r="6" fill="#38bdf8"/>

  <!-- Southern 2.5D Extruded Airlock Tunnel & Stairs (Where Astronauts Enter!) -->
  <polygon points="94,154 136,154 142,218 88,218" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="98" y="162" width="34" height="48" rx="5" fill="#090d16" stroke="#facc15" stroke-width="2.5"/>
  <!-- Glowing Cyan Airlock Door Frame & Window -->
  <rect x="104" y="168" width="22" height="16" rx="3" fill="#22d3ee"/>
  <line x1="98" y1="192" x2="132" y2="192" stroke="#38bdf8" stroke-width="2"/>
  <!-- 3D Steps Leading Down from Airlock -->
  <polygon points="90,214 140,214 148,252 82,252" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="88" y1="224" x2="142" y2="224" stroke="#0f172a" stroke-width="3"/>
  <line x1="86" y1="234" x2="144" y2="234" stroke="#0f172a" stroke-width="3"/>
  <line x1="84" y1="244" x2="146" y2="244" stroke="#0f172a" stroke-width="3"/>
</svg>
