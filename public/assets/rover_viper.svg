<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" width="140" height="130">
  <defs>
    <linearGradient id="roverGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="roverDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Ground Shadow -->
  <ellipse cx="70" cy="108" rx="56" ry="16" fill="#020617" opacity="0.68"/>

  <!-- 6 Rugged 3D Titanium Mesh Lunar Wheels (Left & Right Rocker-Bogie Suspension) -->
  <!-- Rear Wheels -->
  <rect x="14" y="54" width="18" height="24" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="108" y="54" width="18" height="24" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <!-- Mid Wheels -->
  <rect x="10" y="74" width="20" height="24" rx="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="110" y="74" width="20" height="24" rx="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Front Wheels -->
  <rect x="14" y="92" width="20" height="24" rx="5" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <rect x="106" y="92" width="20" height="24" rx="5" fill="#1e293b" stroke="#facc15" stroke-width="2"/>

  <!-- 2.5D Extruded Gold-Foil Chassis Box (Front Vertical Wall + Top Solar Deck) -->
  <polygon points="28,78 112,78 116,102 24,102" fill="url(#roverGold)" stroke="#78350f" stroke-width="2.5"/>
  <polygon points="32,48 108,48 112,78 28,78" fill="url(#roverDeck)" stroke="#fde047" stroke-width="2.5"/>
  <!-- Photovoltaic Grid on Rover Top Deck -->
  <line x1="56" y1="48" x2="54" y2="78" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="84" y1="48" x2="86" y2="78" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="30" y1="63" x2="110" y2="63" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Front Dual High-Intensity Cold-Trap Headlamps & Cyan Laser Core Drill Turret -->
  <circle cx="42" cy="90" r="6" fill="#fef08a" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="98" cy="90" r="6" fill="#fef08a" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Center Glowing Cyan Laser Drill Emitter -->
  <rect x="58" y="84" width="24" height="20" rx="4" fill="#090d16" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="70" cy="94" r="7" fill="#22d3ee"/>
  <circle cx="70" cy="94" r="3.5" fill="#ffffff"/>

  <!-- Tall 2.5D Stereo Navigation Camera & Spectrometer Mast Rising Above Rover -->
  <rect x="66" y="18" width="8" height="38" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="52" y="10" width="36" height="14" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="2"/>
  <circle cx="61" cy="17" r="4" fill="#38bdf8"/>
  <circle cx="79" cy="17" r="4" fill="#22d3ee"/>
</svg>
