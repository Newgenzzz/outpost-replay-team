<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 265" width="290" height="265">
  <defs>
    <linearGradient id="bermSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="waterShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.78"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Ground Shadow -->
  <ellipse cx="145" cy="228" rx="132" ry="28" fill="#020617" opacity="0.72"/>

  <!-- 2.5D Sloped Subterranean Regolith Blast Berm (3D Extruded Mound) -->
  <path d="M16,214 L42,118 L248,118 L274,214 Z" fill="url(#bermSlope)" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Heavy Titanium Blast Ribs on Sloped Walls -->
  <polygon points="46,212 68,122 82,122 62,212" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <polygon points="244,212 222,122 208,122 228,212" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- 2.5D Hemispherical Water-Wall Radiation Shield Dome Rising from the Berm Roof -->
  <path d="M58,124 C58,28 232,28 232,124 Z" fill="url(#waterShield)" stroke="#a5f3fc" stroke-width="3"/>
  <!-- Hexagonal Water-Wall Shield Facets & Magnetic Deflector Rings -->
  <ellipse cx="145" cy="92" rx="72" ry="14" fill="none" stroke="#cffafe" stroke-width="2" opacity="0.8"/>
  <ellipse cx="145" cy="66" rx="48" ry="10" fill="none" stroke="#cffafe" stroke-width="2" opacity="0.8"/>
  <circle cx="145" cy="44" r="12" fill="#22d3ee" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Front Subterranean Armored Vault Entrance Portal (3/4 Extruded Frame) -->
  <polygon points="84,132 206,132 216,222 74,222" fill="#090d16" stroke="#94a3b8" stroke-width="3"/>
  <!-- Yellow/Black Radiation Shelter Hazard Chevrons -->
  <rect x="86" y="138" width="118" height="10" fill="#facc15"/>
  <path d="M96,138 L90,148 M112,138 L106,148 M128,138 L122,148 M144,138 L138,148 M160,138 L154,148 M176,138 L170,148 M192,138 L186,148" stroke="#090d16" stroke-width="4"/>

  <!-- Heavy Interlocking Blast Vault Doors + Glowing Cyan Shield Core -->
  <rect x="94" y="152" width="102" height="66" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="145" y1="152" x2="145" y2="218" stroke="#090d16" stroke-width="4"/>
  <circle cx="145" cy="184" r="16" fill="#083344" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="145" cy="184" r="7" fill="#67e8f9"/>

  <!-- Descend Ramp & Stairs into the Bunker -->
  <polygon points="86,218 204,218 218,254 72,254" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="82" y1="230" x2="208" y2="230" stroke="#0f172a" stroke-width="3"/>
  <line x1="78" y1="242" x2="212" y2="242" stroke="#0f172a" stroke-width="3"/>
</svg>
