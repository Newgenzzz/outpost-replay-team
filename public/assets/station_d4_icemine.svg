<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 265" width="280" height="265">
  <defs>
    <linearGradient id="craterPit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="iceCrystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gantrySteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Stepped 90 K Cold-Trap Crater Rim & Deep Pit -->
  <ellipse cx="140" cy="198" rx="126" ry="52" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <!-- Vertical Stepped Rock Wall Inside Crater -->
  <ellipse cx="140" cy="202" rx="106" ry="42" fill="#1e293b" stroke="#0e7490" stroke-width="2"/>
  <ellipse cx="140" cy="206" rx="84" ry="32" fill="url(#craterPit)" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- 3D Glowing Cyan Water-Ice Crystal Spires Rising from the Crater Pit -->
  <polygon points="74,202 88,154 102,204" fill="url(#iceCrystal)" stroke="#cffafe" stroke-width="1.5"/>
  <polygon points="92,210 108,164 120,212" fill="url(#iceCrystal)" stroke="#cffafe" stroke-width="1.5"/>
  <polygon points="164,210 178,156 194,208" fill="url(#iceCrystal)" stroke="#cffafe" stroke-width="1.5"/>
  <polygon points="184,204 202,148 214,202" fill="url(#iceCrystal)" stroke="#cffafe" stroke-width="1.5"/>

  <!-- Steel Bridge Deck Spanning Over the Ice Pit -->
  <polygon points="34,178 246,178 256,196 24,196" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="24" y="196" width="232" height="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Tall 2.5D A-Frame Gantry Drill Derrick Standing Over the Crater -->
  <!-- Left & Right Steel A-Frame Legs -->
  <polygon points="62,186 78,186 128,36 114,36" fill="url(#gantrySteel)" stroke="#78350f" stroke-width="2"/>
  <polygon points="218,186 202,186 152,36 166,36" fill="url(#gantrySteel)" stroke="#78350f" stroke-width="2"/>
  <!-- Cross-Bracing Struts -->
  <line x1="82" y1="142" x2="198" y2="142" stroke="#fef08a" stroke-width="4"/>
  <line x1="98" y1="96" x2="182" y2="96" stroke="#fef08a" stroke-width="4"/>
  <line x1="84" y1="142" x2="180" y2="96" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="196" y1="142" x2="100" y2="96" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Top Derrick Head & Cryo-Winch Housing -->
  <rect x="106" y="22" width="68" height="24" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="140" cy="34" r="7" fill="#22d3ee"/>

  <!-- Vertical Spiral Auger & Active Cyan Laser Core Drill Plunging into the Ice Pit -->
  <rect x="134" y="46" width="12" height="136" fill="#090d16" stroke="#67e8f9" stroke-width="2"/>
  <path d="M134,56 L146,68 M134,76 L146,88 M134,96 L146,108 M134,116 L146,128 M134,136 L146,148 M134,156 L146,168" stroke="#22d3ee" stroke-width="3"/>
  <!-- Glowing Laser Impact Point in the Ice Pit -->
  <circle cx="140" cy="204" r="18" fill="#22d3ee" opacity="0.45"/>
  <circle cx="140" cy="204" r="9" fill="#ffffff"/>

  <!-- Left 3D H2O Electrolysis & Core Storage Cabin -->
  <polygon points="28,136 82,136 86,146 24,146" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="146" width="62" height="38" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="32" y="154" width="46" height="12" rx="2" fill="#22d3ee"/>
</svg>
