<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112">
  <defs>
    <linearGradient id="suitWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Ground Contact Shadow -->
  <ellipse cx="48" cy="101" rx="26" ry="8" fill="#020617" opacity="0.55"/>

  <!-- 3D PLSS Life-Support Backpack Behind Shoulders -->
  <rect x="24" y="28" width="48" height="44" rx="8" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
  <rect x="28" y="22" width="10" height="8" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="64" cy="20" r="4" fill="#fde047"/>
  <line x1="64" y1="24" x2="64" y2="32" stroke="#475569" stroke-width="2.5"/>

  <!-- 2.5D Legs & Heavy Lunar EVA Boots -->
  <rect x="31" y="72" width="14" height="22" rx="5" fill="url(#suitWhite)" stroke="#334155" stroke-width="2.5"/>
  <rect x="51" y="72" width="14" height="22" rx="5" fill="url(#suitWhite)" stroke="#334155" stroke-width="2.5"/>
  <!-- Knee Joint Rings -->
  <line x1="31" y1="81" x2="45" y2="81" stroke="#0284c7" stroke-width="3"/>
  <line x1="51" y1="81" x2="65" y2="81" stroke="#0284c7" stroke-width="3"/>
  <!-- Lunar Boots -->
  <ellipse cx="38" cy="96" rx="9" ry="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="58" cy="96" rx="9" ry="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>

  <!-- 2.5D Pressurized Suit Torso & Commander Red/Gold Stripes -->
  <rect x="27" y="42" width="42" height="34" rx="10" fill="url(#suitWhite)" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Commander Red Shoulder & Chest Chevron -->
  <path d="M29,48 L67,48" stroke="#ef4444" stroke-width="4"/>
  <!-- Chest Display & Control Module (DCM) -->
  <rect x="35" y="53" width="26" height="16" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="41" cy="61" r="3" fill="#38bdf8"/>
  <circle cx="48" cy="61" r="3" fill="#22c55e"/>
  <rect x="53" y="57" width="5" height="8" rx="1" fill="#facc15"/>

  <!-- Left & Right EVA Arms + Gloves -->
  <rect x="16" y="45" width="12" height="24" rx="6" fill="url(#suitWhite)" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="22" cy="69" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <rect x="68" y="45" width="12" height="24" rx="6" fill="url(#suitWhite)" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="74" cy="69" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>

  <!-- 2.5D Bubble Helmet & Reflective Gold Solar Visor -->
  <circle cx="48" cy="27" r="21" fill="url(#suitWhite)" stroke="#1e293b" stroke-width="2.5"/>
  <ellipse cx="48" cy="29" rx="16" ry="13" fill="url(#goldVisor)" stroke="#451a03" stroke-width="2"/>
  <!-- Specular Sky Highlight on Curved Gold Visor -->
  <path d="M37,23 C41,19 50,19 56,22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.88"/>
  <!-- Helmet Headlamp Bar -->
  <rect x="41" y="9" width="14" height="5" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
</svg>
