<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 275" width="280" height="275">
  <defs>
    <linearGradient id="rocketHull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- 2.5D Ground Shadow -->
  <ellipse cx="142" cy="236" rx="124" ry="26" fill="#020617" opacity="0.7"/>

  <!-- 2.5D Raised Concrete/Steel Launch Pad with Flame Trench (Top + Front Wall) -->
  <polygon points="26,204 254,204 268,224 268,244 254,254 26,254 12,244 12,224" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <polygon points="32,166 248,166 268,224 12,224" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Deep Flame Deflector Trench in Center of Pad -->
  <polygon points="94,184 186,184 196,216 84,216" fill="#020617" stroke="#f59e0b" stroke-width="2"/>

  <!-- Left 2.5D Vertical Umbilical Launch Gantry Tower -->
  <rect x="44" y="34" width="32" height="172" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <path d="M44,50 L76,72 L44,94 L76,116 L44,138 L76,160 L44,182 L76,204" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M76,50 L44,72 L76,94 L44,116 L76,138 L44,160 L76,182 L44,204" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- Swing-Arm Crew & Fuel Umbilical Bridge to Rocket -->
  <rect x="76" y="76" width="54" height="10" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="76" y="128" width="54" height="10" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- Right High-Gain Deep Space Downlink Dish Tower -->
  <rect x="212" y="118" width="12" height="84" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="218" cy="108" rx="32" ry="20" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="218" cy="104" r="6" fill="#38bdf8"/>
  <line x1="218" y1="104" x2="218" y2="82" stroke="#38bdf8" stroke-width="3"/>

  <!-- Tall 2.5D Vertical Lunar Ascent Vehicle (Standing Vertically in Center!) -->
  <!-- 4 Landing Gear Struts -->
  <line x1="124" y1="168" x2="100" y2="206" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="166" y1="168" x2="190" y2="206" stroke="#cbd5e1" stroke-width="4"/>
  <ellipse cx="98" cy="208" rx="10" ry="4" fill="#f59e0b"/>
  <ellipse cx="192" cy="208" rx="10" ry="4" fill="#f59e0b"/>

  <!-- Rocket Engine Bell & Thruster Glow -->
  <polygon points="132,174 158,174 168,200 122,200" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="145" cy="202" rx="18" ry="6" fill="#38bdf8" opacity="0.85"/>

  <!-- Lower Gold Kapton Foil Descent Stage Cylinder -->
  <rect x="114" y="132" width="62" height="44" rx="4" fill="url(#goldFoil)" stroke="#fef08a" stroke-width="2"/>
  <!-- Upper Pressurized White/Titanium Ascent Stage & Nose Cone -->
  <path d="M116,132 L116,66 C116,32 174,32 174,66 L174,132 Z" fill="url(#rocketHull)" stroke="#475569" stroke-width="2.5"/>
  <!-- Crew Cockpit Windows & RCS Thruster Pods -->
  <polygon points="126,68 142,62 142,78 126,80" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
  <polygon points="164,68 148,62 148,78 164,80" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
  <!-- Vertical Docking Hatch -->
  <rect x="136" y="96" width="18" height="28" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="145" cy="24" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
</svg>
